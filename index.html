<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活動サポート - Karon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand"><span>K</span><strong>Activity Support</strong></div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-copy">
        <p>Support</p>
        <h1>活動を支援する</h1>
        <span>あなたの寄付が活動の力になります。</span>
      </div>
    </section>

    <section class="product-section">
      <div class="card" style="padding: 24px; background: white; border-radius: 8px;">
        <input type="number" id="amount" placeholder="金額を入力 (円)" style="margin-bottom: 15px;">
        <button id="pay-btn" class="primary-link">寄付する</button>
        <p id="status" style="margin-top: 15px;"></p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
